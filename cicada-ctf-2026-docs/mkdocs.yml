site_name: "Cicada CTF 2026 — Official Documentation"
site_description: "End-to-End Event Record, Operational Handbook & Stakeholder Report for Cicada CTF 2026 (BIT Mesra & IEEE Student Branch)"
site_author: "Cicada CTF 2026 Documentation Team"
docs_dir: "."
site_dir: "dist/site"

exclude_docs: |
  10-appendices/contact-directory-INTERNAL.md
  scripts/*
  dist/*

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: README.md
  - "00. Front Matter":
      - "Cover Page": 00-front-matter/cover-page.md
      - "About the Event": 00-front-matter/about-the-event.md
